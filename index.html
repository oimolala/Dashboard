<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sparks Preschool — Growth Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{--ink:#0F172A;--ink2:#334155;--ink3:#64748B;--line:#E2E8F0;--line2:#F1F5F9;--bg:#F4F6F9;--accent:#6366F1;--accent2:#8B5CF6;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--card:#FFFFFF;}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;scroll-behavior:smooth}
.mono{font-family:'DM Mono',monospace}
#filter-bar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.06);transition:padding .2s}
#filter-bar.expanded{padding:12px 24px 14px}
#filter-bar.collapsed{padding:6px 24px}
#filter-bar.collapsed #filter-full{display:none}
#filter-bar.collapsed #filter-compact{display:flex}
#filter-bar.expanded #filter-compact{display:none}
#filter-bar.expanded #filter-full{display:block}
.pill{cursor:pointer;transition:all .15s}
.pill.on{background:#0F172A;color:#fff}
.pill.off{background:#fff;color:#0F172A;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.kpi-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;color:#94A3B8;margin-bottom:10px}
</style>
</head>
<body class="min-h-screen pb-16">
<div id="hm-tooltip" style="position:fixed;z-index:9999;display:none;background:rgba(15,23,42,.92);color:#fff;font-size:11px;border-radius:8px;padding:8px 12px;pointer-events:none"></div>

<script>
const CONFIG = {
  SHEET_ID: "1F9pE41X-RmLa5MM53NG3QjqMMRn74sdUSiXNDq_Faqg",
  SHEET_TAB: "Full OBT",
  SHEET_GID: "2062700628",
  COL: {
    date: ["date"],
    center: ["center","branch","cabang","outlet","location"],
    channel: ["source","channel","lead source","traffic source"],
    adSpend: ["ads spending","ads spent","ad spend","spend","spending","cost"],
    leads: ["^leads$","leads"],
    bookingBD: ["booking_bd","booking by book","book date"],
    bookingTD: ["booking_td","booking by trial","trial date"],
    showUps: ["^su$","show ups","show-ups","showups","attended"],
    newStudents: ["^ns$","new students","newstudents","active enrollment"],
    leadsT: ["leads t","leads target","target leads"],
    bookingT: ["booking t","bookings target","target booking"],
    showUpsT: ["su t","showup target","target su"],
    newStudentsT: ["ns t","ns target","target ns"],
    revenue: ["^revenue$","revenue","total revenue","rev"]
  },
  BOOKING_BASIS: "BD",
  CENTERS: ["BTR","BGR","BSD","CKR","KGD","KMG","TBT","BHI","BTY","BTU","CBN","TMP","BDM","STR","GLC","CBG","CBB","CKG","BDG"],
  CHANNELS: ["Meta","Google","TikTok","Cross-Sell","Referral","Offline"],
  CHANNEL_ALIASES: {"meta":"Meta","facebook":"Meta","google":"Google","tiktok":"TikTok","tt":"TikTok","cross sell":"Cross-Sell","referral":"Referral","offline":"Offline"}
};
</script>

<header style="background:#0F172A;padding:18px 24px">
  <h1 class="text-xl font-bold text-white">Sparks Preschool Dashboard</h1>
  <p class="text-xs text-slate-400" id="last-updated">Initializing...</p>
</header>

<div id="filter-bar" class="expanded">
  <div id="filter-compact">
    <button onclick="toggleFilter()" class="text-xs font-bold border rounded px-2 py-1">Filters</button>
  </div>
  <div id="filter-full">
    <div class="space-y-4">
      <div><div class="section-label">Period</div><div id="period-pills" class="flex gap-2"></div></div>
      <div><div class="section-label">Center</div><div id="center-pills" class="flex flex-wrap gap-2"></div></div>
    </div>
  </div>
</div>

<div id="main-content" class="px-6 pt-4 space-y-6">
  <div id="kpi-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
  <div class="card p-4"><canvas id="chart-trend" height="300"></canvas></div>
</div>

<script>
Chart.register(ChartDataLabels);
const $ = id => document.getElementById(id);
const STATE = { rows:[], filters:{centers:new Set(CONFIG.CENTERS), period:"L4W", channels:new Set(CONFIG.CHANNELS)}, charts:{} };

async function init(){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&gid=${CONFIG.SHEET_GID}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.match(/setResponse\(([\s\S]*)\)/)[1]);
    processData(json.table);
    $("last-updated").textContent = "Data loaded successfully";
  } catch(e) {
    $("last-updated").textContent = "Error loading data: " + e.message;
  }
}

function processData(table){
  const headers = table.cols.map(c => c.label.toLowerCase());
  STATE.rows = table.rows.map(r => {
    return {
      date: new Date(r.c[headers.indexOf("date")]?.v),
      center: r.c[headers.indexOf("center")]?.v,
      channel: r.c[headers.indexOf("source")]?.v,
      leads: r.c[headers.indexOf("leads")]?.v || 0,
      newStudents: r.c[headers.indexOf("ns")]?.v || 0,
      adSpend: r.c[headers.indexOf("ads spending")]?.v || 0
    };
  });
  render();
}

function toggleFilter(){
  const bar = $("filter-bar");
  bar.classList.toggle("expanded");
  bar.classList.toggle("collapsed");
}

function render(){
  const agg = STATE.rows.reduce((a,b)=>({leads:a.leads+b.leads, ns:a.ns+b.newStudents}), {leads:0, ns:0});
  $("kpi-grid").innerHTML = `
    <div class="kpi-card"><div class="text-xs text-slate-500">Total Leads</div><div class="text-2xl font-bold">${agg.leads.toLocaleString()}</div></div>
    <div class="kpi-card"><div class="text-xs text-slate-500">New Students</div><div class="text-2xl font-bold">${agg.ns.toLocaleString()}</div></div>
  `;
  renderTrend();
}

function renderTrend(){
  if(STATE.charts["trend"]) STATE.charts["trend"].destroy();
  const ctx = $("chart-trend").getContext("2d");
  STATE.charts["trend"] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: STATE.rows.map(r => r.date.toLocaleDateString()),
      datasets: [{label: 'Leads', data: STATE.rows.map(r => r.leads), borderColor: '#6366F1'}]
    },
    options: { maintainAspectRatio: false }
  });
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
