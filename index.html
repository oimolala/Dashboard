<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sparks Preschool — Growth Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  body { background: #F4F6F9; font-family: 'DM Sans', sans-serif; }
  .card { background: white; border: 1px solid #E2E8F0; border-radius: 14px; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94A3B8; margin: 15px 0 10px; }
</style>
</head>
<body class="pb-16">

<script>
const CONFIG = {
  SHEET_ID: "1F9pE41X-RmLa5MM53NG3QjqMMRn74sdUSiXNDq_Faqg",
  SHEET_TAB: "Full OBT",
  // Map these to the EXACT headers from your sheet
  COL: {
    date: ["Date"],
    center: ["Center"],
    channel: ["Source"],
    adSpend: ["Ads Spend"],
    leads: ["Leads"],
    bookingBD: ["Booking_BD"],
    bookingTD: ["Booking_TD"],
    showUps: ["SU"],
    newStudents: ["NS"],
    revenue: ["Revenue"] // Set to null/fallback if not in sheet
  },
  CENTERS: ["BTR","BGR","BSD","CKR","KGD","KMG","TBT","BHI","BTY","BTU","CBN","TMP","BDM","STR","GLC","CBG","CBB","CKG","BDG"],
  CHANNELS: ["Meta","Google","TikTok","Cross-Sell","Referral","Offline"],
};

// Global State
const STATE = { rows: [], cols: {}, filters: { centers: new Set(CONFIG.CENTERS), channels: new Set(CONFIG.CHANNELS), period: "L4W" } };

// Core Fetch Logic
async function loadData() {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_TAB)}`;
  try {
    const res = await fetch(url);
    const txt = await res.text();
    const json = JSON.parse(txt.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/)[1]);
    processData(json.table);
  } catch (e) {
    console.error("Fetch Error:", e);
    document.getElementById("last-updated").innerHTML = "Error loading data. Check console.";
  }
}

function processData(table) {
  const headers = table.cols.map(c => c.label);
  // Match indices
  for (const k in CONFIG.COL) {
    STATE.cols[k] = headers.findIndex(h => CONFIG.COL[k].includes(h));
  }
  
  STATE.rows = table.rows.map(r => {
    const get = (key) => r.c[STATE.cols[key]]?.v;
    return {
      date: new Date(get("date")),
      center: get("center"),
      channel: get("channel"),
      adSpend: parseFloat(get("adSpend") || 0),
      leads: parseFloat(get("leads") || 0),
      bookingBD: parseFloat(get("bookingBD") || 0),
      bookingTD: parseFloat(get("bookingTD") || 0),
      showUps: parseFloat(get("showUps") || 0),
      newStudents: parseFloat(get("newStudents") || 0),
      revenue: parseFloat(get("revenue") || 0)
    };
  }).filter(r => !isNaN(r.date));
  
  document.getElementById("last-updated").textContent = "Data Loaded Successfully";
  // Trigger your render functions here
  console.log("Data loaded, rows:", STATE.rows.length);
}

window.onload = loadData;
</script>

<header class="p-6 bg-slate-900 text-white">
  <h1 class="text-2xl font-bold">Sparks Preschool</h1>
  <p id="last-updated" class="text-sm text-slate-400">Loading data...</p>
</header>
<div id="main-content" class="p-6">
  </div>

</body>
</html>
